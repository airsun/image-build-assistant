apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibe-hedgedoc-backend
  namespace: techlab
  labels:
    app.kubernetes.io/name: vibe-hedgedoc-backend
    app.kubernetes.io/part-of: hedgedoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vibe-hedgedoc-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibe-hedgedoc-backend
        app.kubernetes.io/part-of: hedgedoc
    spec:
      containers:
        - name: backend
          image: harbor.tech.skytech.io/ai.infra/vibe-hedgedoc-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: vibe-hedgedoc-config
            - secretRef:
                name: vibe-hedgedoc-secret
          volumeMounts:
            - name: uploads
              mountPath: /usr/src/app/backend/uploads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: vibe-hedgedoc-uploads
